<style>
:root{color-scheme:light;--bg:#f3f6f4;--paper:#fff;--ink:#202923;--muted:#66736a;--line:#d8e0da;--line2:#b6c3ba;--green:#16734b;--green2:#e1f1e7;--blue:#28617b;--blue2:#e6f1f5;--amber:#98610d;--amber2:#fff2d8;--red:#a5372e;--red2:#fff0ed}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh;display:grid;grid-template-columns:278px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#fbfcfa;border-right:1px solid var(--line);padding:19px 15px}.brand{padding:2px 3px 16px;border-bottom:1px solid var(--line)}.brand .eyebrow{margin:0 0 4px;color:var(--green);font-size:12px;font-weight:800}.brand h1{margin:0;font-size:21px;line-height:1.25}.brand p{margin:7px 0 0;color:var(--muted);font-size:13px}.overview{padding:15px 2px 12px}.overview-title,.section-title{margin:0 0 9px;font-size:12px;color:var(--muted);font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 7px;border:1px solid var(--line);background:var(--paper);border-radius:5px}.stat b{display:block;font-size:20px;line-height:1.2}.stat span{font-size:11px;color:var(--muted)}.progress{height:7px;margin-top:10px;background:#e4eae5;border-radius:9px;overflow:hidden}.progress i{height:100%;width:0;display:block;background:var(--green);transition:width .2s}.sidebar-section{padding:13px 2px;border-top:1px solid var(--line)}.module-list{display:grid;gap:3px}.module-button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 9px;border-radius:5px}.module-button:hover{background:#edf3ee}.module-button[aria-current="true"]{background:var(--green2);color:#155d3d;font-weight:750}.module-button small{font-size:11px;color:var(--muted);white-space:nowrap}.side-controls label,.filters label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:9px 0 4px}.side-controls input,.side-controls select,.filters select{width:100%;min-height:38px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink)}.button{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 11px;border-radius:5px;font-weight:650}.button:hover{border-color:var(--line2);background:#f9fbf9}.button.primary{color:#fff;background:var(--green);border-color:var(--green)}.button.primary:hover{background:#105d3d}.button.missed{color:var(--red);border-color:#e5b7b1;background:var(--red2)}.button.subtle{color:var(--muted)}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.button-row .button{margin-top:8px}.main{min-width:0;padding:23px clamp(18px,3vw,42px) 30px}.main-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}.main-head h2{margin:0;font-size:23px;line-height:1.3}.main-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.filterbar{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:12px;padding:14px 0}.filterbar .field{min-width:0}.filterbar label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:4px}.filterbar select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:7px 9px}.sessionbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:5px 0 12px;color:var(--muted);font-size:13px}.sessionbar strong{color:var(--ink);font-variant-numeric:tabular-nums}.navbuttons{display:flex;align-items:center;gap:8px}.card{min-height:390px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:clamp(23px,4vw,44px);display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(31,52,39,.04)}.card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;background:var(--blue2);color:#225871;font-weight:750}.badge.core{background:var(--green2);color:#185e3d}.badge.detail{background:var(--amber2);color:#805006}.front{font-size:25px;line-height:1.42;font-weight:750;margin:42px 0 24px;max-width:900px}.answer{border-top:1px solid var(--line);padding-top:17px;margin-top:auto;font-size:17px;white-space:pre-wrap}.answer-label{font-size:12px;color:var(--green);font-weight:800;margin-bottom:6px}.answer-text{line-height:1.75}.source{margin-top:14px;color:var(--muted);font-size:12px}.card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}.grade-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{background:#fff;border:1px solid var(--line);border-radius:7px;text-align:center;padding:58px 18px}.empty h3{margin:0 0 6px}.empty p{margin:0;color:var(--muted)}.foot{color:var(--muted);font-size:12px;margin-top:18px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:900px){.app{grid-template-columns:230px minmax(0,1fr)}.filterbar{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.app{display:block}.sidebar{position:relative;width:100%;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:13px 15px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:11px}.brand p{display:none}.overview{padding:10px 2px}.stats{max-width:440px}.sidebar-section{padding:9px 2px}.module-list{grid-template-columns:repeat(2,minmax(0,1fr))}.module-button{padding:7px}.side-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.side-controls .search{grid-column:1/-1}.side-controls .progress-actions{grid-column:1/-1}.main{padding:16px 14px 24px}.main-head{display:block}.head-actions{justify-content:flex-start;margin-top:12px}.filterbar{grid-template-columns:1fr 1fr;gap:8px}.filterbar .field:first-child{grid-column:1/-1}.card{min-height:350px;padding:21px}.front{font-size:22px;margin-top:30px}.card-actions{align-items:flex-start}.grade-actions{width:100%}.grade-actions .button{flex:1}}
</style>
<script src="cards-data.js"></script>
</head>
<body>
<div class="app">
<aside class="sidebar" aria-label="课程导航与筛选">
  <div class="brand"><div><p class="eyebrow">ELECTROTECHNOLOGY</p><h1>课程知识点卡</h1><p>完整课程 · S1–S10</p></div></div>
  <section class="overview"><h2 class="overview-title">学习进度</h2><div class="stats"><div class="stat"><b id="knownCount">0</b><span>已记住</span></div><div class="stat"><b id="missedCount">0</b><span>待复习</span></div><div class="stat"><b id="newCount">0</b><span>未刷</span></div></div><div class="progress" aria-label="掌握进度"><i id="progressBar"></i></div></section>
  <section class="sidebar-section"><h2 class="section-title">课程模块</h2><nav class="module-list" id="moduleList" aria-label="模块选择"></nav></section>
  <section class="sidebar-section side-controls">
    <div class="search"><label for="search">搜索卡片</label><input id="search" type="search" placeholder="概念、问题、答案"></div>
    <div><label for="topic">主题</label><select id="topic"><option value="all">全部主题</option></select></div>
    <div><label for="level">重要程度</label><select id="level"><option value="all">全部</option><option value="core">核心考点</option><option value="detail">细节知识</option></select></div>
    <div><label for="mode">复习范围</label><select id="mode"><option value="all">全部卡片</option><option value="new">未刷</option><option value="missed">没记住</option><option value="known">已记住</option></select></div>
    <div><label for="order">卡片顺序</label><select id="order"><option value="sequence">按课程顺序</option><option value="shuffle">随机顺序</option></select></div>
    <div class="progress-actions"><div class="button-row"><button class="button" id="exportProgress">导出进度</button><button class="button" id="importProgress">导入进度</button><button class="button subtle" id="resetProgress">清空进度</button><button class="button subtle" id="randomCard">随机一张</button></div><input class="sr-only" id="progressFile" type="file" accept="application/json"></div>
  </section>
</aside>
<main class="main">
  <header class="main-head"><div><h2 id="moduleTitle">全部课程 · 知识点卡</h2><p id="subtitle">按教材梳理核心考点和细节知识。先主动回忆，再翻开答案。</p></div><div class="head-actions"><a class="button" id="lessonPdf" href="downloads/Electrotechnology_教材全解_合订版.pdf" target="_blank" rel="noopener">教材全解 PDF</a></div></header>
  <section class="filterbar" aria-label="卡片筛选"><div class="field"><label for="moduleSelect">模块</label><select id="moduleSelect"></select></div><div class="field"><label for="topicSelect">主题</label><select id="topicSelect"></select></div><div class="field"><label for="levelSelect">重要程度</label><select id="levelSelect"><option value="all">全部</option><option value="core">核心考点</option><option value="detail">细节知识</option></select></div><div class="field"><label for="modeSelect">复习范围</label><select id="modeSelect"><option value="all">全部卡片</option><option value="new">未刷</option><option value="missed">没记住</option><option value="known">已记住</option></select></div><div class="field"><label for="orderSelect">顺序</label><select id="orderSelect"><option value="sequence">课程顺序</option><option value="shuffle">随机顺序</option></select></div></section>
  <div class="sessionbar"><span id="resultCount">共 0 张卡片</span><div class="navbuttons"><button class="button" id="previous" aria-label="上一张" title="上一张">上一张</button><strong id="counter">0 / 0</strong><button class="button" id="next" aria-label="下一张" title="下一张">下一张</button></div></div>
  <article class="card" id="card" aria-live="polite"><div class="card-meta"><span class="badge" id="moduleBadge"></span><span id="topicBadge"></span><span class="badge" id="levelBadge"></span><span id="cardStatus"></span></div><h3 class="front" id="front"></h3><div class="answer" id="answer" hidden><div class="answer-label">答案与理解</div><div class="answer-text" id="back"></div><div class="source" id="source"></div></div><div class="card-actions"><button class="button" id="reveal">翻开答案</button><div class="grade-actions"><button class="button primary" id="markKnown">记住了</button><button class="button missed" id="markMissed">没记住，加入复习</button></div></div></article>
  <section class="empty" id="empty" hidden><h3>当前筛选没有卡片</h3><p>试试切换模块、主题或复习范围。</p></section>
  <p class="foot">知识卡按课程材料整理；规范数值和产品额定值会随地区、版本和安装条件变化，实际作业请核对现行标准及制造商资料。本页进度保存在当前浏览器，可导出后在其他设备导入。</p>
</main></div>
<script>
const modules=[
  ['S1','安全与隔离'],['S2','工具与加工'],['S3','固定件与支撑'],['S4','图纸与照明回路'],['S5','继电器与接触器'],['S6','电机启动与故障查找'],['S7','导体、端接与电缆'],['S8','验证、测试与故障查找'],['S9','导管与布线安装'],['S10','电缆选型与保护协调']
];
const counts={};const cards=window.STUDY_CARDS.map((r,i)=>{const n=(counts[r[0]]||0)+1;counts[r[0]]=n;return{id:`${r[0]}-${String(n).padStart(3,'0')}`,module:r[0],topic:r[1],level:r[2],source:r[3],front:r[4],back:r[5],order:i}});
const KEY='electrotechnology-study-cards-v2',OLD_KEY='electrotechnology-s2-cards-v1';let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')||{};if(!Object.keys(progress).length){const old=JSON.parse(localStorage.getItem(OLD_KEY)||'{}')||{};for(const [id,state] of Object.entries(old))if(cards.some(c=>c.id===id)&&['known','missed'].includes(state))progress[id]=state}}catch{progress={}}
const $=id=>document.getElementById(id);const filters={module:'all',topic:'all',level:'all',mode:'all',order:'sequence',search:''};let filtered=[],index=0,flipped=false,randomOrder=[];
if(location.pathname.includes('/output/learning_package_official/html/'))$('lessonPdf').href='../../pdf/Electrotechnology_教材全解_合订版.pdf';
function makeOptions(select,items,firstText){const previous=select.value;select.replaceChildren(new Option(firstText,'all'));for(const [value,label] of items)select.add(new Option(label,value));if([...select.options].some(o=>o.value===previous))select.value=previous}
function updateTopicOptions(){const pool=cards.filter(c=>filters.module==='all'||c.module===filters.module);const topics=[...new Set(pool.map(c=>c.topic))].sort((a,b)=>a.localeCompare(b,'zh-CN'));const pairs=topics.map(t=>[t,t]);makeOptions($('topic'),pairs,'全部主题');makeOptions($('topicSelect'),pairs,'全部主题');$('topic').value=$('topicSelect').value=filters.topic}
function selected(){return cards.filter(c=>(filters.module==='all'||c.module===filters.module)&&(filters.topic==='all'||c.topic===filters.topic)&&(filters.level==='all'||c.level===filters.level)&&(filters.mode==='all'||(filters.mode==='new'&&!progress[c.id])||(filters.mode==='missed'&&progress[c.id]==='missed')||(filters.mode==='known'&&progress[c.id]==='known'))&&(!filters.search||`${c.topic} ${c.front} ${c.back} ${c.source}`.toLowerCase().includes(filters.search.toLowerCase())))}
function setModule(id){filters.module=id;filters.topic='all';index=0;$('moduleSelect').value=id;updateTopicOptions();buildModuleList();refresh()}
function buildModuleList(){const nav=$('moduleList');nav.replaceChildren();for(const [id,label] of [['all','全部课程'],...modules]){const button=document.createElement('button');button.className='module-button';button.type='button';button.setAttribute('aria-current',String(filters.module===id));const name=document.createElement('span');name.textContent=id==='all'?label:`${id} ${label}`;const meta=document.createElement('small');const subset=cards.filter(c=>id==='all'||c.module===id);const known=subset.filter(c=>progress[c.id]==='known').length;meta.textContent=`${known}/${subset.length}`;button.append(name,meta);button.onclick=()=>setModule(id);nav.append(button)}}
function refresh(){filtered=selected();if(filters.order==='shuffle')filtered.sort((a,b)=>randomOrder.indexOf(a.id)-randomOrder.indexOf(b.id));index=Math.min(index,Math.max(0,filtered.length-1));render()}
function render(){const known=cards.filter(c=>progress[c.id]==='known').length,missed=cards.filter(c=>progress[c.id]==='missed').length,newCards=cards.length-known-missed;$('knownCount').textContent=known;$('missedCount').textContent=missed;$('newCount').textContent=newCards;$('progressBar').style.width=`${cards.length?Math.round(100*known/cards.length):0}%`;$('resultCount').textContent=`当前 ${filtered.length} 张 · 全课程 ${cards.length} 张`;$('empty').hidden=filtered.length>0;$('card').hidden=filtered.length===0;$('moduleTitle').textContent=filters.module==='all'?'全部课程 · 知识点卡':`${filters.module} ${modules.find(m=>m[0]===filters.module)?.[1]||''} · 知识点卡`;$('subtitle').textContent=filters.mode==='missed'?'遗忘卡循环复习，记住后会从待复习列表移除。':'按教材梳理核心考点和细节知识。先主动回忆，再翻开答案。';buildModuleList();if(!filtered.length){$('counter').textContent='0 / 0';return}const c=filtered[index];$('counter').textContent=`${index+1} / ${filtered.length}`;$('moduleBadge').textContent=c.module;$('topicBadge').textContent=c.topic;$('levelBadge').textContent=c.level==='core'?'核心考点':'细节知识';$('levelBadge').className=`badge ${c.level}`;$('cardStatus').textContent=progress[c.id]==='known'?'· 已记住':progress[c.id]==='missed'?'· 待复习':'· 未刷';$('front').textContent=c.front;$('back').textContent=c.back;$('source').textContent=`来源：${c.source}`;$('answer').hidden=!flipped;$('reveal').textContent=flipped?'合上答案':'翻开答案';$('previous').disabled=filtered.length<2;$('next').disabled=filtered.length<2}
function move(step){if(!filtered.length)return;index=(index+step+filtered.length)%filtered.length;flipped=false;render()}
function setRating(state){const c=filtered[index];if(!c)return;progress[c.id]=state;localStorage.setItem(KEY,JSON.stringify(progress));const previousCount=filtered.length;refresh();if(filtered.length===previousCount&&filtered.length){index=(index+1)%filtered.length;flipped=false;render()}}
function randomize(){randomOrder=cards.map(c=>c.id).sort(()=>Math.random()-.5);filters.order='shuffle';$('order').value=$('orderSelect').value='shuffle';index=0;refresh()}
function syncControls(){for(const [key,ids] of Object.entries({module:['moduleSelect'],topic:['topicSelect'],level:['levelSelect'],mode:['modeSelect'],order:['orderSelect']}))for(const id of ids)$(id).value=filters[key];$('topic').value=filters.topic;$('level').value=filters.level;$('mode').value=filters.mode;$('order').value=filters.order}
function syncFrom(source){filters.module=$('moduleSelect').value;filters.topic=source==='topic'?$(`${source}Select`).value:$('topicSelect').value;filters.level=$('levelSelect').value;filters.mode=$('modeSelect').value;filters.order=$('orderSelect').value;filters.search=$('search').value;if(filters.order==='shuffle'&&!randomOrder.length)randomOrder=cards.map(c=>c.id).sort(()=>Math.random()-.5);index=0;updateTopicOptions();syncControls();buildModuleList();refresh()}
function exportProgress(){const data={schema:1,course:'Electrotechnology',updatedAt:new Date().toISOString(),progress};const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='electrotechnology-learning-progress.json';a.click();URL.revokeObjectURL(url)}
async function importProgress(file){try{const data=JSON.parse(await file.text());if(!data.progress||typeof data.progress!=='object')throw Error('bad data');for(const [id,state] of Object.entries(data.progress))if(cards.some(c=>c.id===id)&&['known','missed'].includes(state))progress[id]=state;localStorage.setItem(KEY,JSON.stringify(progress));refresh();alert('学习进度已导入。')}catch{alert('无法读取进度文件，请选择本页面导出的 JSON 文件。')}}
for(const [id,label] of modules){const o=new Option(`${id} · ${label}`,id);$('moduleSelect').add(o)}$('moduleSelect').insertAdjacentHTML('afterbegin','<option value="all">全部课程</option>');
$('moduleList').onclick=null;buildModuleList();updateTopicOptions();
$('moduleSelect').onchange=()=>setModule($('moduleSelect').value);$('topic').onchange=()=>{$('topicSelect').value=$('topic').value;syncFrom('topic')};$('topicSelect').onchange=()=>{$('topic').value=$('topicSelect').value;syncFrom('topic')};$('level').onchange=$('levelSelect').onchange=e=>{filters.level=e.target.value;syncControls();index=0;refresh()};$('mode').onchange=$('modeSelect').onchange=e=>{filters.mode=e.target.value;syncControls();index=0;refresh()};$('order').onchange=$('orderSelect').onchange=e=>{filters.order=e.target.value;if(filters.order==='shuffle')randomOrder=cards.map(c=>c.id).sort(()=>Math.random()-.5);syncControls();index=0;refresh()};$('search').oninput=()=>{filters.search=$('search').value;index=0;refresh()};$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reveal').onclick=()=>{flipped=!flipped;render()};$('markKnown').onclick=()=>setRating('known');$('markMissed').onclick=()=>setRating('missed');$('randomCard').onclick=()=>{if(!filtered.length)randomize();else{index=Math.floor(Math.random()*filtered.length);flipped=false;render()}};$('exportProgress').onclick=exportProgress;$('importProgress').onclick=()=>$('progressFile').click();$('progressFile').onchange=async e=>{if(e.target.files[0])await importProgress(e.target.files[0]);e.target.value=''};$('resetProgress').onclick=()=>{if(confirm('清空此浏览器保存的全部课程卡片进度？')){progress={};localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);refresh()}};document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||e.target.isContentEditable)return;if(e.code==='Space'&&!e.repeat){e.preventDefault();flipped=!flipped;render()}else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1)});
refresh();
</script>
</body></html>
